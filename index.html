<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Oregon Trail Hunt - Prototype</title>

  <link rel="stylesheet" href="styles/hunt.css" />
  <link rel="stylesheet" href="styles/overlays/rifle_overlay.css" />
</head>

<body>
  <main id="huntRoot" class="hunt-root" aria-label="Hunting Minigame">
    <div class="layer layer-bg" aria-hidden="true"></div>

    <div class="layer layer-targets" aria-hidden="true">
      <img id="demoTarget" class="target-sprite"
           src="assets/targets/squirrel_right.webp" alt="" draggable="false" />
    </div>

    <div class="layer layer-ui" aria-hidden="true">
      <div id="reticle" class="reticle" aria-hidden="true"></div>

      <div class="rifle-overlay" aria-hidden="true">
        <img src="assets/overlays/rifle-overlay.webp" alt="" draggable="false" />
      </div>
    </div>

    <!-- Controls (NO debug visible by default) -->
    <div class="layer layer-controls" aria-label="Controls">
      <button id="fireBtn" class="btn-fire" type="button">FIRE</button>

      <!-- Debug row: hidden unless ?debug=1 -->
      <div id="debugRow" class="debug-row" hidden aria-label="Debug Controls">
        <button id="rifleUpBtn" class="btn-secondary" type="button">Rifle Up</button>
        <button id="rifleDownBtn" class="btn-secondary" type="button">Rifle Down</button>
        <span id="hudText" class="hud-text">Debug</span>
      </div>
    </div>

    <!-- Modal -->
    <div id="modalBackdrop" class="modal-backdrop modal-closed">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h2 id="modalTitle" class="modal-title">THE HUNT</h2>
        </div>

        <div class="modal-body">
          <p id="huntOutcome" class="modal-outcome">Outcome: —</p>
          <div class="modal-grid">
            <div class="row"><div class="label">Meat gained</div><div id="meatValue" class="value">—</div></div>
            <div class="row"><div class="label">Ammunition used</div><div id="ammoValue" class="value">—</div></div>
            <div class="row"><div class="label">Time passed</div><div id="daysValue" class="value">—</div></div>
          </div>
        </div>

        <div class="modal-footer">
          <button id="continueBtn" class="btn-primary" type="button"
            onclick="window.vc_hunt_close_modal && window.vc_hunt_close_modal()">
            Continue
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const el = (id) => document.getElementById(id);

    const fireBtn = el("fireBtn");
    const demoTarget = el("demoTarget");
    const reticle = el("reticle");

    const modalBackdrop = el("modalBackdrop");
    const continueBtn = el("continueBtn");

    const huntOutcome = el("huntOutcome");
    const meatValue = el("meatValue");
    const ammoValue = el("ammoValue");
    const daysValue = el("daysValue");

    const debugRow = el("debugRow");
    const rifleUpBtn = el("rifleUpBtn");
    const rifleDownBtn = el("rifleDownBtn");
    const hudText = el("hudText");

    // iOS: prevent rubberband/scroll gestures
    document.addEventListener("touchmove", (e) => e.preventDefault(), { passive:false });

    // Modal controls (class-driven)
    function openModal(payload){
      huntOutcome.textContent = `Outcome: ${payload.outcome}`;
      meatValue.textContent = payload.meat;
      ammoValue.textContent = payload.ammo;
      daysValue.textContent = payload.days;

      modalBackdrop.classList.remove("modal-closed");
      modalBackdrop.classList.add("modal-open");
    }
    function closeModal(){
      modalBackdrop.classList.remove("modal-open");
      modalBackdrop.classList.add("modal-closed");
    }
    window.vc_hunt_close_modal = closeModal;
    continueBtn.addEventListener("click", closeModal);
    closeModal();

    // Demo target motion (placeholder)
    let raf = 0;
    let last = 0;
    let x = -200;
    let dir = 1;
    const speed = 420;

    function viewport(){ return { w: window.innerWidth, h: window.innerHeight }; }

    function setTrack(){
      const { h } = viewport();
      demoTarget.style.top = `${Math.round(h*0.46)}px`;
    }

    function placeStart(){
      const { w } = viewport();
      const tw = demoTarget.getBoundingClientRect().width || 200;
      x = (dir === 1) ? (-tw - 40) : (w + 40);
      demoTarget.style.transform = `translate3d(${x}px,0,0)`;
    }

    function loop(t){
      const dt = (t - last)/1000 || 0;
      last = t;
      x += dir * speed * dt;
      demoTarget.style.transform = `translate3d(${x}px,0,0)`;

      const { w } = viewport();
      const r = demoTarget.getBoundingClientRect();
      if (dir === 1 && r.left > w + 80){ dir = -1; placeStart(); }
      if (dir === -1 && r.right < -80){ dir = 1; placeStart(); }

      raf = requestAnimationFrame(loop);
    }

    function reticleCenterX(){
      const r = reticle.getBoundingClientRect();
      return r.left + r.width/2;
    }
    function targetCenterX(){
      const r = demoTarget.getBoundingClientRect();
      return r.left + r.width/2;
    }

    fireBtn.addEventListener("click", () => {
      if (modalBackdrop.classList.contains("modal-open")) return;

      const dx = Math.abs(targetCenterX() - reticleCenterX());
      const tw = demoTarget.getBoundingClientRect().width || 200;
      const pct = (dx/tw)*100;

      let outcome = "Miss";
      if (pct <= 10) outcome = "Perfect hit";
      else if (pct <= 25) outcome = "Solid hit";
      else if (pct <= 40) outcome = "Graze";

      openModal({ outcome, meat: "—", ammo: "1", days: "—" });
    });

    // Debug gate: ONLY enable when ?debug=1
    const params = new URLSearchParams(window.location.search);
    const debugEnabled = params.get("debug") === "1";

    if (debugEnabled) {
      debugRow.hidden = false;

      let rifleY = parseInt(getComputedStyle(document.documentElement)
        .getPropertyValue("--vc-rifle-offset-y")) || 0;

      function setRifleY(px){
        document.documentElement.style.setProperty("--vc-rifle-offset-y", `${px}px`);
        hudText.textContent = `Rifle Y: ${px}px`;
      }

      setRifleY(rifleY);

      rifleUpBtn.addEventListener("click", () => { rifleY -= 10; setRifleY(rifleY); });
      rifleDownBtn.addEventListener("click", () => { rifleY += 10; setRifleY(rifleY); });
    }

    // Boot
    setTrack();
    placeStart();
    raf = requestAnimationFrame(loop);
    window.addEventListener("resize", setTrack);
  </script>
</body>
</html>
