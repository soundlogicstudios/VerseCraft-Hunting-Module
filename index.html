<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VerseCraft Target Debug</title>

  <!-- IMPORTANT:
       If your project uses a <base href="...">, it can break relative asset paths.
       For this debug harness, DO NOT use <base>.
  -->

  <!-- Rifle overlay positioning CSS -->
  <link rel="stylesheet" href="styles/overlays/rifle_overlay.css" />

  <style>
    /* Debug seen-it-all layer */
    body {
      margin: 0;
      background: #101010;
      color: #fff;
      font-family: -apple-system, system-ui, sans-serif;
      overflow: hidden;
    }

    /* This is the ONLY container we use.
       It must be positioned so absolute overlays behave predictably. */
    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #1b1b1b 0%, #0a0a0a 55%, #000 100%);
    }

    /* Fixed reticule (DO NOT MOVE IT IN JS) */
    #reticule {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 48px;
      height: 48px;
      transform: translate(-50%, -50%);
      z-index: 60;
      pointer-events: none;
    }
    #reticule::before,
    #reticule::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.9);
    }
    #reticule::before { width: 2px; height: 48px; }
    #reticule::after { width: 48px; height: 2px; }

    /* Debug HUD */
    #hud {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 9999;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.35;
      max-width: 80vw;
      white-space: pre-wrap;
      pointer-events: none;
    }

    /* Tap to shoot area (so you can test without your full input system) */
    #tapToShoot {
      position: absolute;
      inset: 0;
      z-index: 70;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      cursor: crosshair;
    }
  </style>
</head>

<body>
  <div id="game">
    <!-- This full-screen button is ONLY for debug testing shots -->
    <button id="tapToShoot" aria-label="Tap to shoot"></button>

    <!-- Fixed reticule -->
    <div id="reticule"></div>

    <!-- Rifle overlay image (YOUR overlay file path goes here) -->
    <div id="rifle-overlay" class="rifle-overlay">
      <!-- Use your actual rifle overlay path -->
      <img src="assets/ui/rifle-overlay.webp" alt="Rifle overlay" />
    </div>

    <!-- Debug HUD -->
    <div id="hud">HUD: waiting…</div>
  </div>

  <!-- Target runner (the JS file you added) -->
  <script src="src/overlays/target_runner.js"></script>

  <script>
    // ===========================
    // 1) Make rifle adjustable
    // ===========================
    // Example: push rifle DOWN 36px (positive down, negative up)
    document.documentElement.style.setProperty("--vc-rifle-offset-y", "36px");

    // ===========================
    // 2) Start target runner
    //    IMPORTANT: mount into #game, not body
    // ===========================
    // If your target_runner.js has mount_selector hardcoded to "body",
    // update it to "#game" in CONFIG.
    // Or do this quick override if you exposed CONFIG (if not, edit the file):
    if (window.vc_targets && typeof window.vc_targets.start === "function") {
      window.vc_targets.start();
    } else {
      console.error("vc_targets not found. Check script src path.");
    }

    // ===========================
    // 3) Debug HUD: show type + src + image errors
    // ===========================
    const hud = document.getElementById("hud");

    function logHUD(msg) {
      hud.textContent = msg;
    }

    window.addEventListener("vc:target_spawn", (e) => {
      const d = e.detail || {};
      logHUD(
        `SPAWN: ${d.type || "?"}\n` +
        `dir: ${d.dir || "?"}\n` +
        `reticule: fixed\n` +
        `note: if you see a moving missing-image box, paths still wrong`
      );
    });

    window.addEventListener("vc:shot_hit", (e) => {
      const d = e.detail || {};
      logHUD(`HIT: ${d.type || "?"}\nremaining hp: ${d.hp ?? d.remaining_hp ?? "?"}`);
    });

    window.addEventListener("vc:shot_miss", () => {
      logHUD(`MISS`);
    });

    window.addEventListener("vc:target_killed", (e) => {
      const d = e.detail || {};
      logHUD(`KILLED: ${d.type || "?"}`);
    });

    window.addEventListener("vc:player_injured", (e) => {
      const d = e.detail || {};
      logHUD(`INJURED\nsource: ${d.source || "?"}`);
    });

    // If your target_runner.js emits this (my debug version did):
    window.addEventListener("vc:target_img_error", (e) => {
      const d = e.detail || {};
      logHUD(`IMG ERROR\nsrc: ${d.src || "?"}\nbaseURI: ${d.baseURI || "?"}`);
    });

    // ===========================
    // 4) Shoot on tap/click (debug)
    // ===========================
    document.getElementById("tapToShoot").addEventListener("click", () => {
      window.dispatchEvent(new Event("vc:shoot"));
    });
  </script>
</body>
</html>
