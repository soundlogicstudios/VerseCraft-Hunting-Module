<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>VerseCraft Hunting Module - Prototype</title>

  <link rel="stylesheet" href="styles/hunt.css" />
</head>

<body>
  <main id="huntRoot" class="hunt-root" aria-label="Hunting Minigame">
    <div class="layer layer-bg" aria-hidden="true"></div>
    <div class="layer layer-targets" aria-hidden="true">
  <img
    id="demoTarget"
    class="target-sprite"
    src="assets/targets/squirrel-right-facing.webp"
    alt=""
    draggable="false"
  />
</div>

    <div class="layer layer-targets" aria-hidden="true">
      <img id="demoTarget" class="target-sprite"
           src="assets/targets/squirrel-right-facing.webp"
           alt="" draggable="false" />
    </div>

    <div class="layer layer-ui" aria-hidden="true">
      <div id="reticle" class="reticle" aria-hidden="true"></div>

      <!-- Rifle overlay as background image via CSS (.rifle-overlay) -->
      <div class="rifle-overlay" aria-hidden="true"></div>
    </div>

    <div class="layer layer-controls" aria-label="Controls">
      <!-- Minimal HUD pinned to TOP via CSS (.mini-hud in hunt.css) -->
      <div class="mini-hud" aria-label="HUD">
        <div class="hudItem" aria-hidden="true">
          <span class="label">Ammo</span>
          <span id="ammoHud" class="value">—</span>
        </div>
        <div class="hudItem" aria-hidden="true">
          <span class="label">Food</span>
          <span id="foodHud" class="value">—</span>
        </div>
        <div class="hudItem" aria-hidden="true">
          <span class="label">Day</span>
          <span id="dayHud" class="value">—</span>
        </div>
      </div>

      <button id="fireBtn" class="btn-fire" type="button">FIRE</button>

      <!-- Debug row only when ?debug=1 -->
      <div id="debugRow" class="debug-row" aria-label="Debug Controls" hidden>
        <button id="resetBtn" class="btn-secondary" type="button">Reset Pass</button>
        <button id="toggleGuidesBtn" class="btn-secondary" type="button">Toggle Guides</button>
        <span id="hudText" class="hud-text">DEBUG</span>
      </div>
    </div>

    <!-- Modal -->
    <div id="modalBackdrop" class="modal-backdrop modal-closed">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h2 id="modalTitle" class="modal-title">THE HUNT</h2>
        </div>

        <div class="modal-body">
          <p id="huntOutcome" class="modal-outcome">Outcome: —</p>

          <div class="modal-grid" role="group" aria-label="Hunt Summary">
            <div class="row"><div class="label">Target</div><div id="targetValue" class="value">—</div></div>
            <div class="row"><div class="label">Ammunition used</div><div id="ammoValue" class="value">—</div></div>
            <div class="row"><div class="label">Food gained</div><div id="foodValue" class="value">—</div></div>
            <div class="row"><div class="label">Total Food</div><div id="foodTotalValue" class="value">—</div></div>
          </div>

          <div id="noteRow" class="row" style="display:none; margin-top:10px;">
            <div class="label">Note</div><div id="noteValue" class="value">—</div>
          </div>
        </div>

        <div class="modal-footer">
          <button id="continueBtn" class="btn-primary" type="button"
                  onclick="window.vc_hunt_close_modal && window.vc_hunt_close_modal()">
            Continue
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const el = (id) => document.getElementById(id);

    const fireBtn = el("fireBtn");
    const demoTarget = el("demoTarget");
    const reticle = el("reticle");

    const debugRow = el("debugRow");
    const resetBtn = el("resetBtn");
    const toggleGuidesBtn = el("toggleGuidesBtn");
    const hudText = el("hudText");

    const ammoHud = el("ammoHud");
    const foodHud = el("foodHud");
    const dayHud  = el("dayHud");

    const modalBackdrop = el("modalBackdrop");
    const continueBtn = el("continueBtn");

    const huntOutcome = el("huntOutcome");
    const targetValue = el("targetValue");
    const ammoValue = el("ammoValue");
    const foodValue = el("foodValue");
    const foodTotalValue = el("foodTotalValue");
    const noteRow = el("noteRow");
    const noteValue = el("noteValue");

    // iOS: prevent rubberband/scroll gestures
    document.addEventListener("touchmove", (e) => e.preventDefault(), { passive:false });

    // Debug gate
    const DEBUG = new URLSearchParams(location.search).get("debug") === "1";
    if (DEBUG) debugRow.hidden = false;

    // ---------- GAME RULES (LOCKED SIMPLE VERSION) ----------
    const AMMO_PER_ROUND = 7;       // YOU asked: 7 shots per "daily" round
    const FOOD_CAP_LBS = 100;       // YOU asked: can't carry more than 100 lbs
    const HIT_MODAL_DELAY_MS = 220; // small pause so the kill doesn't "escape" behind modal

    // Food gained by animal (base), then scaled by hit quality
    const FOOD_BASE = {
      squirrel: 6,
      rabbit:  10,
      deer:    35,
      bear:    60
    };

    // multipliers by outcome
    const FOOD_MULT = {
      "Perfect hit": 1.00,
      "Solid hit":   0.75,
      "Graze":       0.35,
      "Miss":        0.00
    };

    // ---------- Modal ----------
    function openModal(payload){
      huntOutcome.textContent = `Outcome: ${payload.outcome}`;
      targetValue.textContent = payload.target;
      ammoValue.textContent = payload.ammoUsed;
      foodValue.textContent = payload.foodGained;
      foodTotalValue.textContent = payload.foodTotal;

      if (payload.note && DEBUG){
        noteValue.textContent = payload.note;
        noteRow.style.display = "flex";
      } else {
        noteRow.style.display = "none";
      }

      modalBackdrop.classList.remove("modal-closed");
      modalBackdrop.classList.add("modal-open");
    }

    function closeModal(){
      modalBackdrop.classList.remove("modal-open");
      modalBackdrop.classList.add("modal-closed");

      // If hunting is over, keep everything frozen.
      if (huntOver) return;

      // Resume and start next pass cleanly after modal closes
      scheduleNextPass();
    }

    window.vc_hunt_close_modal = closeModal;
    continueBtn.addEventListener("click", closeModal);
    closeModal();

    // ---------- Assets ----------
    const TARGET_SPRITES = {
      squirrel: { left: "assets/targets/squirrel-left-facing.webp", right: "assets/targets/squirrel-right-facing.webp" },
      rabbit:   { left: "assets/targets/rabbit-left-facing.webp",   right: "assets/targets/rabbit-right-facing.webp" },
      deer:     { left: "assets/targets/deer-left-facing.webp",     right: "assets/targets/deer-right-facing.webp" },
      bear:     { left: "assets/targets/bear-left-facing.webp",     right: "assets/targets/bear-right-facing.webp" }
    };

    // Weighted random per PASS
    const WEIGHTS = [
      { type: "squirrel", w: 0.45 },
      { type: "rabbit",   w: 0.30 },
      { type: "deer",     w: 0.20 },
      { type: "bear",     w: 0.05 }
    ];

    // Speed per animal (px/sec)
    const SPEED = {
      squirrel: 520,
      rabbit:   460,
      deer:     360,
      bear:     260
    };

    // Ammo cost per shot
    const AMMO_COST = {
      squirrel: 1,
      rabbit:   1,
      deer:     1,
      bear:     2
    };

    // ---------- State ----------
    let day = 1;           // simple "round/day" label
    let ammo = AMMO_PER_ROUND;
    let food = 0;

    let currentAnimal = "squirrel";
    let direction = 1; // 1 = left->right, -1 = right->left
    let x = -200;
    let tStart = 0;
    let raf = 0;

    let passActive = false;
    let shotTakenThisPass = false;
    let huntOver = false;

    function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

    function setHud(){
      ammoHud.textContent = String(ammo);
      foodHud.textContent = `${food} lbs`;
      dayHud.textContent  = `Day ${day}`;
    }

    function pickWeighted(){
      const total = WEIGHTS.reduce((s,i) => s + i.w, 0);
      let r = Math.random() * total;
      for (const i of WEIGHTS){
        r -= i.w;
        if (r <= 0) return i.type;
      }
      return WEIGHTS[WEIGHTS.length - 1].type;
    }

    function setTargetFacingForDirection(dir){
      const facing = (dir === 1) ? "right" : "left";
      demoTarget.setAttribute("src", TARGET_SPRITES[currentAnimal][facing]);
    }

    function viewport(){ return { w: window.innerWidth, h: window.innerHeight }; }

    // DO NOT CHANGE: your locked track position
    function setTargetTrack(){
      const { h } = viewport();
      demoTarget.style.top = `${Math.round(h * 0.46)}px`;
    }

    function placeTargetStart(){
      const { w } = viewport();
      const tw = demoTarget.getBoundingClientRect().width || 200;

      x = (direction === 1) ? (-tw - 40) : (w + 40);
      demoTarget.style.transform = `translate3d(${x}px,0,0)`;
    }

    function hideTargetInstant(){
      demoTarget.style.opacity = "0";
    }

    function showTarget(){
      demoTarget.style.opacity = "1";
    }

    function startNewPass(){
      if (huntOver) return;

      // If we hit caps, end the hunt and freeze.
      if (ammo <= 0){
        endHunt("Out of ammo");
        return;
      }
      if (food >= FOOD_CAP_LBS){
        endHunt("Food limit reached");
        return;
      }

      currentAnimal = pickWeighted();
      direction = (Math.random() < 0.5) ? 1 : -1;
      shotTakenThisPass = false;
      passActive = true;

      showTarget();
      setTargetFacingForDirection(direction);
      setHud();
      setTargetTrack();
      placeTargetStart();

      if (DEBUG) hudText.textContent = `PASS: ${currentAnimal} dir=${direction} speed=${SPEED[currentAnimal]}`;
    }

    function scheduleNextPass(){
      if (huntOver) return;
      // small delay before next pass
      setTimeout(() => startNewPass(), 450);
    }

    function endPass(){
      passActive = false;
      // Do NOT start next pass while modal is open.
      if (modalBackdrop.classList.contains("modal-open")) return;
      scheduleNextPass();
    }

    function endHunt(reason){
      huntOver = true;
      passActive = false;
      fireBtn.disabled = true;
      fireBtn.textContent = "DONE";
      hideTargetInstant();

      openModal({
        outcome: "Hunt Over",
        target: "—",
        ammoUsed: "0",
        foodGained: "0 lbs",
        foodTotal: `${food} lbs`,
        note: reason
      });
    }

    function reticleCenterX(){
      const r = reticle.getBoundingClientRect();
      return r.left + r.width / 2;
    }

    function targetCenterX(){
      const r = demoTarget.getBoundingClientRect();
      return r.left + r.width / 2;
    }

    function computeOutcome(){
      const dx = Math.abs(targetCenterX() - reticleCenterX());
      const tw = demoTarget.getBoundingClientRect().width || 200;
      const deltaPct = (dx / tw) * 100;

      let outcome = "Miss";
      if (deltaPct <= 10) outcome = "Perfect hit";
      else if (deltaPct <= 25) outcome = "Solid hit";
      else if (deltaPct <= 40) outcome = "Graze";

      return { outcome, deltaPct };
    }

    function computeFoodGain(animal, outcome){
      const base = FOOD_BASE[animal] || 0;
      const mult = FOOD_MULT[outcome] ?? 0;
      return Math.round(base * mult);
    }

    function tick(now){
      const dt = (now - tStart) / 1000;
      tStart = now;

      if (passActive){
        const speed = SPEED[currentAnimal];
        x += direction * speed * dt;
        demoTarget.style.transform = `translate3d(${x}px,0,0)`;

        const { w } = viewport();
        const r = demoTarget.getBoundingClientRect();

        // If the animal exits, pass ends (no-shot costs 0 ammo)
        if (direction === 1 && r.left > w + 80) endPass();
        if (direction === -1 && r.right < -80) endPass();
      }

      raf = requestAnimationFrame(tick);
    }

    // ---------- Guides ----------
    let guidesOn = false;
    function toggleGuides(){
      guidesOn = !guidesOn;
      document.documentElement.classList.toggle("guides-on", guidesOn);
      if (DEBUG) hudText.textContent = guidesOn ? "Guides ON" : "Guides OFF";
    }

    // ---------- Fire ----------
    fireBtn.addEventListener("click", () => {
      if (huntOver) return;
      if (modalBackdrop.classList.contains("modal-open")) return;
      if (!passActive) return;
      if (shotTakenThisPass) return;

      const cost = AMMO_COST[currentAnimal] || 1;
      if (ammo < cost){
        openModal({
          outcome:"No Ammo",
          target: currentAnimal.toUpperCase(),
          ammoUsed:"0",
          foodGained:"0 lbs",
          foodTotal:`${food} lbs`,
          note:"ammo too low"
        });
        return;
      }

      // Spend ammo ONLY on FIRE (locked rule)
      ammo -= cost;
      shotTakenThisPass = true;
      setHud();

      const { outcome, deltaPct } = computeOutcome();

      // Freeze the pass immediately so it doesn't "run away" behind modal
      passActive = false;

      // If hit (not Miss), hide target immediately to sell the kill
      const gained = computeFoodGain(currentAnimal, outcome);
      let actuallyGained = gained;

      if (outcome !== "Miss" && gained > 0){
        hideTargetInstant();
        const before = food;
        food = clamp(food + gained, 0, FOOD_CAP_LBS);
        actuallyGained = food - before;
      }

      setHud();

      // Delay modal slightly so the shot feels like it lands before UI takeover
      setTimeout(() => {
        openModal({
          outcome,
          target: currentAnimal.toUpperCase(),
          ammoUsed: String(cost),
          foodGained: `${actuallyGained} lbs`,
          foodTotal: `${food} lbs`,
          note: `delta ${deltaPct.toFixed(1)}%`
        });

        // Check end conditions right after showing results
        if (ammo <= 0){
          // Let user hit Continue, but freeze the hunt.
          huntOver = true;
          fireBtn.disabled = true;
          fireBtn.textContent = "DONE";
          // Update note when debugging; main reason is obvious: ammo 0
        } else if (food >= FOOD_CAP_LBS){
          huntOver = true;
          fireBtn.disabled = true;
          fireBtn.textContent = "DONE";
        }
      }, HIT_MODAL_DELAY_MS);
    });

    // When modal closes, we resume by scheduling the next pass (unless huntOver)
    // closeModal() already handles this.

    // ---------- Debug buttons ----------
    if (DEBUG){
      resetBtn.addEventListener("click", () => {
        // End current pass immediately, start another (unless huntOver)
        passActive = false;
        if (!modalBackdrop.classList.contains("modal-open")) scheduleNextPass();
      });

      toggleGuidesBtn.addEventListener("click", toggleGuides);
      hudText.textContent = "BOOT OK";
    }

    window.addEventListener("resize", setTargetTrack);

    // Boot
    setHud();
    startNewPass();
    tStart = performance.now();
    raf = requestAnimationFrame(tick);
  </script>

  <script src="src/ui/overlays/target_runner.js"></script>
  <script>
    if (window.vc_targets) {
      window.vc_targets.start();
    }
  </script>
</body>

</html>
