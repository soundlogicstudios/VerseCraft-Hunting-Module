<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>VerseCraft Hunting Module - Prototype</title>

  <!-- Force iOS Safari to re-fetch latest CSS -->
  <link rel="stylesheet" href="./styles/hunt.css?v=20260219_02" />
  <link rel="stylesheet" href="./styles/rifle_overlay.css?v=20260219_02" />

  <!-- Debug banner style (only used when ?debug=1) -->
  <style>
    #cssDiagBanner{
      position: fixed;
      left: 0; right: 0; top: 0;
      z-index: 2147483647;
      padding: 10px 12px;
      font: 700 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      letter-spacing: .04em;
      text-transform: uppercase;
      display: none;
      color: #fff;
      background: rgba(160, 0, 0, .92);
      border-bottom: 1px solid rgba(255,255,255,.25);
    }
  </style>
</head>

<body>
  <div id="cssDiagBanner">CSS DIAG</div>

  <main id="huntRoot" class="hunt-root" aria-label="Hunting Minigame">
    <!-- HUD / NAV -->
    <div class="hunt-hud" aria-label="HUD">
      <button id="backBtn" class="nav-btn" type="button" aria-label="Back">BACK</button>

      <div class="hudItem"><span class="label">FOOD</span> <span id="foodHud" class="value">0 lbs</span></div>
      <div class="hudItem"><span class="label">AMMO</span> <span id="ammoHudTop" class="value">7</span></div>
      <div class="hudItem"><span class="label">DAYS</span> <span id="dayHud" class="value">1</span></div>
    </div>

    <div class="layer layer-bg" aria-hidden="true"></div>

    <!-- targets mount into this layer -->
    <div class="layer layer-targets" aria-hidden="true"></div>

    <div class="layer layer-ui" aria-hidden="true">
      <div id="reticle" class="reticle" aria-hidden="true"></div>

      <div class="rifle-overlay" aria-hidden="true">
        <img id="rifleOverlayImg" src="assets/overlays/rifle-overlay.webp" alt="" draggable="false" />
      </div>
    </div>

    <div class="layer layer-controls" aria-label="Controls">
      <button id="fireBtn" class="btn-fire" type="button">FIRE</button>

      <!-- Hidden unless ?debug=1 -->
      <div id="debugRow" class="debug-row" aria-label="Debug Controls" hidden>
        <button id="toggleGuidesBtn" class="btn-secondary" type="button">Toggle Guides</button>
        <span id="hudText" class="hud-text">DEBUG</span>
      </div>
    </div>

    <!-- MODAL -->
    <div id="modalBackdrop" class="modal-backdrop modal-open">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h2 id="modalTitle" class="modal-title">THE HUNT</h2>
        </div>

        <div class="modal-body">
          <p id="huntOutcome" class="modal-outcome">Outcome: —</p>

          <div class="modal-grid" role="group" aria-label="Hunt Summary">
            <div class="row"><div class="label">Target</div><div id="targetValue" class="value">—</div></div>
            <div class="row"><div class="label">Meat gained</div><div id="meatValue" class="value">—</div></div>
            <div class="row"><div class="label">Ammunition used</div><div id="ammoValue" class="value">—</div></div>
            <div class="row"><div class="label"></div><div id="noteValue" class="value">—</div></div>
          </div>
        </div>

        <div class="modal-footer">
          <button id="continueBtn" class="btn-primary" type="button">Start Hunt</button>
        </div>
      </div>
    </div>
  </main>

  <!-- CSS load detector (only shows when ?debug=1) -->
  <script>
    (function(){
      const qs = new URLSearchParams(location.search);
      const DEBUG = qs.get("debug") === "1";
      if (!DEBUG) return;

      function show(msg){
        const b = document.getElementById("cssDiagBanner");
        if (!b) return;
        b.textContent = msg;
        b.style.display = "block";
      }

      window.addEventListener("load", () => {
        // hunt.css sets body background to #000 and fixes scrolling.
        const bg = getComputedStyle(document.body).backgroundColor;
        const htmlPos = getComputedStyle(document.documentElement).position;
        const modal = document.getElementById("modalBackdrop");
        const modalDisplay = modal ? getComputedStyle(modal).display : "missing";

        const huntCssLikelyLoaded =
          (bg === "rgb(0, 0, 0)" || bg === "rgba(0, 0, 0, 1)") &&
          (htmlPos === "fixed") &&
          (modalDisplay === "flex");

        if (!huntCssLikelyLoaded) {
          show("HUNT.CSS NOT APPLIED — check path/case/caching. bg=" + bg + " htmlPos=" + htmlPos + " modal=" + modalDisplay);
          console.log("[css-diag] hunt.css not applied", { bg, htmlPos, modalDisplay, href: location.href });
        } else {
          show("CSS OK (hunt.css applied)");
          setTimeout(() => {
            const b = document.getElementById("cssDiagBanner");
            if (b) b.style.display = "none";
          }, 1200);
        }
      });
    })();
  </script>

  <!-- IMPORTANT: runner must load BEFORE hunt_main -->
  <script src="target_runner.js"></script>
  <script src="hunt_main.js"></script>
</body>
</html>
